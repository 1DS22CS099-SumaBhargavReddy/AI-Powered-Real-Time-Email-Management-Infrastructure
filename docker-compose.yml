version: '3.8'

services:
  # ========================================
  # PostgreSQL Database - Relational data
  # ========================================
  postgres:
    image: postgres:15
    container_name: email-infra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: email_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - email-infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis Cache & Queue Infrastructure
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: email-infra-redis
    ports:
      - "6383:6379"
    networks:
      - email-infra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # Qdrant - Vector Database for RAG
  # ========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: email-infra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - email-infra-network
    restart: unless-stopped

  # ========================================
  # Elasticsearch - Full-Text Search Engine
  # ========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: email-infra-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xms512m"
    ports:
      - "9200:9200"
    networks:
      - email-infra-network
    restart: unless-stopped

  # ========================================
  # Backend Infrastructure API Application
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-infra-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/email_db?schema=public
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=email-infra-prod-jwt-secret-key-32-chars!
      - ENCRYPTION_KEY=email-infra-temp-encryption-key-32
      - FRONTEND_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - email-infra-network
    restart: unless-stopped

  # ========================================
  # Frontend Application
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-infra-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - email-infra-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  email-infra-network:
    driver: bridge
